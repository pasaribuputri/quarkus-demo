# Jenis database
quarkus.datasource.db-kind=postgresql

# Koneksi ke PostgreSQL
quarkus.datasource.username=postgres
quarkus.datasource.password=poilpoil
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/postgres

# Hibernate ORM
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.scripts.generation=none
quarkus.hibernate-orm.log.sql=true

mp.jwt.verify.issuer=putri-app
# # smallrye.jwt.sign.key-location=privateKey.pem
# # mp.jwt.verify.publickey.location=publicKey.pem

# mp.jwt.signer.private-key-location=privateKey.pem
# mp.jwt.verify.publickey.location=publicKey.pem
# mp.jwt.signer.algorithm=RS256

# Lokasi private key
mp.jwt.signer.private-key-location=META-INF/resources/privateKey.pem

# Algoritma yang digunakan
mp.jwt.signer.algorithm=RS256



# Enable CORS
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with
quarkus.http.cors.exposed-headers=location,authorization

